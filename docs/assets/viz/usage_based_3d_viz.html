<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用法基盤モデル — 言語パターンの可視化</title>
    <style>
        :root {
            --bg: #0a0a1a;
            --panel: rgba(255,255,255,0.05);
            --panel-border: rgba(255,255,255,0.1);
            --text-1: #f0f0f5;
            --text-2: rgba(255,255,255,0.75);
            --text-3: rgba(255,255,255,0.55);
            --accent: #f093fb;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: system-ui, -apple-system, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Meiryo', sans-serif;
            background: var(--bg);
            color: var(--text-1);
            overflow: hidden;
            display: flex; flex-direction: column; gap: 8px;
            padding: 12px 16px;
        }
        .panel {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
        }

        /* Header: title + controls */
        header {
            display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
            gap: 8px 16px;
        }
        h1 {
            font-size: 20px; line-height: 1.3;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle { font-size: 13px; color: var(--text-3); }
        .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        button {
            font: inherit; font-size: 13px; color: white;
            padding: 7px 14px;
            background: rgba(102, 126, 234, 0.35);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 22px;
            cursor: pointer; transition: background 0.2s;
            white-space: nowrap;
        }
        button:hover { background: rgba(118, 75, 162, 0.6); }
        .speed {
            display: inline-flex; gap: 2px; padding: 2px;
            border: 1px solid rgba(255,255,255,0.15); border-radius: 22px;
        }
        .speed button { border: none; background: transparent; padding: 5px 11px; }
        .speed button:hover { background: rgba(118, 75, 162, 0.45); }
        .speed button[aria-pressed="true"] { background: linear-gradient(135deg, #667eea, #764ba2); }

        .phase { padding: 8px 18px; text-align: center; }
        .phase-title { font-size: 16px; font-weight: bold; color: var(--accent); }
        .phase-desc { font-size: 14px; line-height: 1.55; color: var(--text-2); margin-top: 2px; }

        /* Network stage: the canvas only covers this box, so panels never hide nodes */
        .stage { position: relative; flex: 1; min-height: 140px; }
        canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

        .tooltip {
            position: absolute; left: 0; top: 0; z-index: 2;
            background: rgba(20,20,40,0.95);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
            padding: 10px 14px; pointer-events: none;
            font-size: 12px; color: var(--text-2);
        }
        .tooltip[hidden] { display: none; }
        .tooltip-word {
            display: flex; align-items: center; gap: 6px;
            font-size: 16px; font-weight: bold; color: var(--text-1); margin-bottom: 6px;
        }
        .tooltip dl { display: grid; grid-template-columns: auto auto; gap: 2px 14px; }
        .tooltip dt { color: var(--text-3); }
        .tooltip dd { color: var(--text-1); text-align: right; }

        /* Readout: current input + stats */
        .readout { display: flex; flex-wrap: wrap; gap: 8px; }
        .ticker {
            flex: 1 1 280px; display: flex; align-items: center; gap: 12px;
            padding: 6px 16px; min-height: 54px;
        }
        .ticker-no, .ticker-count { font-size: 12px; color: var(--text-3); white-space: nowrap; }
        .ticker-text { flex: 1; font-size: 18px; color: var(--text-3); }
        .ticker-text .w { color: var(--text-2); border-bottom: 3px solid var(--wc); transition: background 0.2s; }
        .ticker-text .w.done { color: var(--text-1); }
        .ticker-text .w.now { background: rgba(255,255,255,0.14); border-radius: 3px 3px 0 0; }
        .ticker-text ruby { ruby-align: center; }
        .ticker-text rt { font-size: 10px; color: var(--text-3); }
        .stats { display: flex; justify-content: center; gap: 14px; padding: 6px 16px; }
        .stat { text-align: center; min-width: 54px; }
        .stat-number { font-size: 22px; font-weight: bold; line-height: 1.25; }
        .stat-label { font-size: 11px; color: var(--text-3); }

        .legend {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px;
            font-size: 12px; color: var(--text-2);
        }
        .legend .item { display: inline-flex; align-items: center; gap: 5px; }
        .legend .muted { color: var(--text-3); }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
        .glyph-size { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--text-2); }
        .glyph-link { width: 16px; height: 3px; border-radius: 2px; background: var(--text-2); }
        .hint-touch { display: none; }
        @media (hover: none) {
            .hint-mouse { display: none; }
            .hint-touch { display: inline; }
        }

        @media (max-width: 560px) {
            body { padding: 10px 12px; }
            h1 { font-size: 18px; }
            .subtitle { display: none; }
            button { font-size: 12px; padding: 6px 10px; }
            .speed button { padding: 4px 8px; }
            .phase { padding: 6px 12px; }
            .phase-desc { font-size: 12px; line-height: 1.5; }
            .ticker { padding: 6px 12px; }
            .ticker-text { font-size: 16px; }
            .stats { gap: 8px; padding: 4px 10px; }
            .stat-number { font-size: 18px; }
            .legend { font-size: 11px; gap: 2px 10px; }
        }
        @media (max-height: 620px) {
            .subtitle { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>言語パターンのネットワーク</h1>
            <p class="subtitle">用法基盤モデル — 共起関係の可視化</p>
        </div>
        <div class="controls">
            <button type="button" id="pauseBtn">⏸ 一時停止</button>
            <button type="button" id="resetBtn">↻ リセット</button>
            <div class="speed" id="speedGroup" role="group" aria-label="再生速度" title="再生速度">
                <button type="button" data-speed="0.5" aria-pressed="false">½×</button>
                <button type="button" data-speed="1" aria-pressed="true">1×</button>
                <button type="button" data-speed="3" aria-pressed="false">3×</button>
            </div>
        </div>
    </header>

    <section class="phase panel">
        <div class="phase-title" id="phaseTitle"></div>
        <div class="phase-desc" id="phaseDesc"></div>
    </section>

    <div class="stage" id="stage">
        <canvas id="networkCanvas" role="img" aria-label="語の共起ネットワーク"></canvas>
        <div class="tooltip" id="tooltip" hidden>
            <div class="tooltip-word" id="tooltipWord"></div>
            <dl id="tooltipInfo"></dl>
        </div>
    </div>

    <div class="readout">
        <div class="ticker panel">
            <span class="ticker-no" id="tickerNo"></span>
            <span class="ticker-text" id="tickerText"></span>
            <span class="ticker-count" id="tickerCount"></span>
        </div>
        <div class="stats panel">
            <div class="stat">
                <div class="stat-number" id="utterCount">0</div>
                <div class="stat-label">発話数</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="wordCount">0</div>
                <div class="stat-label">語彙数</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="linkCount">0</div>
                <div class="stat-label">共起関係</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="entrenchedCount">0</div>
                <div class="stat-label">定着ペア</div>
            </div>
        </div>
    </div>

    <div class="legend" id="legend">
        <span class="item"><span class="glyph-size"></span>円の大きさ＝出現回数</span>
        <span class="item"><span class="glyph-link"></span>線の太さ＝共起回数</span>
        <span class="item muted">
            <span class="hint-mouse">語にカーソルを合わせると詳細表示／ドラッグで移動</span>
            <span class="hint-touch">語をタップすると詳細表示</span>
        </span>
    </div>

    <script>
    (() => {
        // --- Corpus data ---
        // Categories only color the nodes as a reading aid; the network is built from co-occurrence alone.
        // Colors: four slots validated against the dark surface (CVD-safe only up to four; every node is labeled).
        const CATEGORIES = [
            { name: '食・生活', color: '#c98500', words: ['朝', '昼', '夜', 'ご飯', 'パン', '弁当', 'コーヒー', 'お茶', '水', 'カフェ', '食べる', '飲む', '焼く', '作る', '起きる', '寝る', '早い', '遅い', '眠い'] },
            { name: '趣味・交流', color: '#d55181', words: ['本', '小説', '新聞', '映画', 'テレビ', '動画', '公園', '散歩', '友達', '電話', 'メール', '手紙', '読む', '見る', '歩く', '話す', '送る', '書く', '言う', '待つ'] },
            { name: '学校', color: '#008300', words: ['学校', '授業', '先生', 'テスト', '宿題', '図書館', '勉強', '質問', '受ける', '忘れる'] },
            { name: '文法', color: '#9085e9', words: ['〜てしまう', '〜ちゃう', '〜ている', '〜てる'] },
        ];
        // Utterances, most frequent first: rank r is sampled with probability ∝ 1/r^ZIPF_S (Zipf's law).
        // [word] becomes a node; [surface|lemma] when the surface form differs. Lemmas starting with 〜 are grammar patterns.
        const UTTERANCES = [
            '[朝][ご飯]を[食べる]', '[コーヒー]を[飲む]', '[友達]と[話す]', '[映画]を[見る]',
            '[朝][早く|早い][起きる]', '[宿題]を[忘れ|忘れる][ちゃった|〜ちゃう]', '[本]を[読む]',
            '[テレビ]を[見|見る][てる|〜てる]', '[授業]を[受ける]', '[夜][遅く|遅い][寝る]',
            '[お茶]を[飲む]', '全部[食べ|食べる][ちゃった|〜ちゃう]', '[友達]を[待っ|待つ][てる|〜てる]',
            '[メール]を[送る]', '[パン]を[焼く]', '[宿題]を[忘れ|忘れる][てしまった|〜てしまう]',
            '[図書館]で[本]を[読む]', '[小説]を[読ん|読む][でいる|〜ている]', '[テスト]を[受ける]',
            '[昼][ご飯]を[食べる]', '[授業]中に[寝|寝る][ちゃった|〜ちゃう]', '[カフェ]で[コーヒー]を[飲む]',
            '[友達]に[電話]する', '[動画]を[見|見る][てる|〜てる]', '[学校]で[勉強]する', '[朝]は[眠い]',
            'つい[言っ|言う][てしまった|〜てしまう]', '[先生]に[質問]する', '[公園]を[散歩]する',
            '[本]を[読ん|読む][でる|〜てる]', '[手紙]を[書く]', '[映画]を[見|見る][ている|〜ている]',
            'お[弁当]を[作る]', '[友達]に[言っ|言う][ちゃった|〜ちゃう]', '[新聞]を[読む]', '[公園]を[歩く]',
            '[水]を[飲む]', '[テスト]の前に[勉強]する', '[先生]を[待っ|待つ][ている|〜ている]',
            '[授業]中に[寝|寝る][てしまった|〜てしまう]', '[メール]を[書く]', '[パン]を[食べ|食べる][てしまった|〜てしまう]',
            '[図書館]で[勉強]する', '[夜]に[テレビ]を[見る]',
        ];

        const ZIPF_S = 1;
        const SEED = 7;           // fixed seed: every reset replays the same input sequence
        const TICK_MS = 450;      // one word per tick at 1×
        const ENTRENCH = 5;       // a pair that co-occurred this often counts as entrenched (定着)
        const SCHEMA_TYPES = 3;   // the last phase starts once a grammar pattern has appeared in this many utterance types
        const FREQ_REF = 30, COUNT_REF = 15;  // scale floors, so early nodes and links don't start at full size
        const STEP_MS = 1000 / 60;
        const BG = '#0a0a1a';

        const PHASES = [
            { title: 'データ収集中…',
              desc: () => '発話が1つずつ入力されます。同じ発話で使われた語どうしが線（共起関係）で結ばれます。' },
            { title: 'パターンが見え始めています',
              desc: () => 'よく一緒に使われる語どうしが引き寄せられ、まとまりができ始めます。色は場面の目安で、ネットワークの計算には使っていません。' },
            { title: 'よく使う組み合わせの定着',
              desc: () => `何度も入力される発話ほど、語（円）は大きく、共起関係（線）は太くなります。${ENTRENCH}回以上共起したペアを「定着」として数えています。` },
            { title: '言語知識の構造化',
              desc: () => '十分なデータから、文法パターンが浮かび上がりました。' },
        ];

        const corpus = UTTERANCES.map(src => {
            const parts = [];
            let last = 0;
            for (const m of src.matchAll(/\[([^\]|]+)(?:\|([^\]]+))?\]/g)) {
                if (m.index > last) parts.push({ text: src.slice(last, m.index) });
                parts.push({ text: m[1], lemma: m[2] || m[1] });
                last = m.index + m[0].length;
            }
            if (last < src.length) parts.push({ text: src.slice(last) });
            return { parts, words: parts.filter(p => p.lemma).map(p => p.lemma), seen: 0 };
        });

        const categoryOf = new Map();
        CATEGORIES.forEach(c => c.words.forEach(w => categoryOf.set(w, c)));
        const OTHER = { name: 'その他', color: '#8a8aa0' };
        const catOf = word => categoryOf.get(word) || OTHER;

        // --- Zipf sampling with a seeded PRNG ---
        const weights = corpus.map((_, i) => 1 / Math.pow(i + 1, ZIPF_S));
        const totalWeight = weights.reduce((a, b) => a + b, 0);
        let cum = 0;
        const cumulative = weights.map(w => (cum += w / totalWeight));

        function mulberry32(a) {
            return () => {
                a |= 0; a = a + 0x6D2B79F5 | 0;
                let t = Math.imul(a ^ a >>> 15, 1 | a);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        function sampleUtterance() {
            const r = random();
            const i = cumulative.findIndex(c => r < c);
            return i === -1 ? corpus.length - 1 : i;
        }

        // --- DOM ---
        const $ = id => document.getElementById(id);
        const el = (tag, text) => Object.assign(document.createElement(tag), { textContent: text });
        const dotEl = color => {
            const dot = el('span', '');
            dot.className = 'dot';
            dot.style.setProperty('--c', color);
            return dot;
        };
        const canvas = $('networkCanvas');
        const ctx = canvas.getContext('2d');
        const stage = $('stage');
        const tooltip = $('tooltip');
        const pauseBtn = $('pauseBtn');
        const FONT = getComputedStyle(document.body).fontFamily;

        // --- State ---
        const nodes = [], links = [];
        const nodeByWord = new Map(), linkByKey = new Map();
        const currentNodes = new Set();
        let random, current, utterCount, entrenchedCount, maxFreq, maxCount, phase;
        let paused = false, speed = 1, inView = false;
        let W = 0, H = 0, sizeScale = 1;
        let hoverNode = null, dragNode = null;
        let rafId = 0, lastTime = 0, tickAcc = 0, physAcc = 0;
        let tooltipKey = '';

        const freqScale = f => Math.log1p(f) / Math.log1p(Math.max(maxFreq, FREQ_REF));
        const countScale = c => Math.log1p(c) / Math.log1p(Math.max(maxCount, COUNT_REF));

        // --- Input: one word per tick, one empty tick between utterances ---
        function step() {
            if (current && current.pos >= current.u.words.length) { current = null; return; }
            if (!current) {
                const idx = sampleUtterance();
                const u = corpus[idx];
                u.seen++;
                utterCount++;
                current = { idx, u, pos: 0 };
                currentNodes.clear();
                renderTicker();
            }
            const { u, idx } = current;
            const prev = u.words.slice(0, current.pos).map(w => nodeByWord.get(w));
            const word = u.words[current.pos];
            const node = nodeByWord.get(word) || createNode(word, prev);
            node.freq++;
            node.pulse = 1;
            node.types.add(idx);
            maxFreq = Math.max(maxFreq, node.freq);
            prev.forEach(p => addLink(node, p));
            currentNodes.add(node);
            current.pos++;
            updateTickerProgress();
            updateStats();
            updatePhase();
        }

        function createNode(word, placed) {
            // New words appear next to the words they co-occur with
            let x = W / 2 + (Math.random() - 0.5) * W * 0.5;
            let y = H / 2 + (Math.random() - 0.5) * H * 0.5;
            if (placed.length) {
                x = placed.reduce((s, n) => s + n.x, 0) / placed.length + (Math.random() - 0.5) * 40;
                y = placed.reduce((s, n) => s + n.y, 0) / placed.length + (Math.random() - 0.5) * 40;
            }
            const node = {
                word, cat: catOf(word), x, y, vx: 0, vy: 0,
                r: 0, freq: 0, degree: 0, types: new Set(),
                pulse: 0, appear: 0, fontSize: 13, labelW: word.length * 13, measuredSize: 0,
            };
            nodes.push(node);
            nodeByWord.set(word, node);
            return node;
        }

        function addLink(a, b) {
            const key = a.word < b.word ? a.word + '|' + b.word : b.word + '|' + a.word;
            let link = linkByKey.get(key);
            if (!link) {
                link = { a, b, count: 0, flash: 0 };
                linkByKey.set(key, link);
                links.push(link);
                a.degree++;
                b.degree++;
            }
            link.count++;
            link.flash = 1;
            maxCount = Math.max(maxCount, link.count);
            if (link.count === ENTRENCH) entrenchedCount++;
        }

        // --- Readouts ---
        function renderTicker() {
            $('tickerNo').textContent = `入力 #${utterCount}`;
            $('tickerText').replaceChildren(...current.u.parts.map(p => {
                if (!p.lemma) return p.text;
                const span = el('span', '');
                span.className = 'w';
                span.style.setProperty('--wc', catOf(p.lemma).color);
                if (p.lemma === p.text) span.textContent = p.text;
                else {
                    // Show the lemma (the node's name) above the surface form
                    const ruby = document.createElement('ruby');
                    ruby.append(p.text, el('rt', p.lemma));
                    span.append(ruby);
                }
                return span;
            }));
            $('tickerCount').textContent = `${current.u.seen}回目`;
        }

        function updateTickerProgress() {
            $('tickerText').querySelectorAll('.w').forEach((s, i) => {
                s.classList.toggle('done', i < current.pos);
                s.classList.toggle('now', i === current.pos - 1);
            });
        }

        function updateStats() {
            $('utterCount').textContent = utterCount;
            $('wordCount').textContent = nodes.length;
            $('linkCount').textContent = links.length;
            $('entrenchedCount').textContent = entrenchedCount;
        }

        // Phases follow the data, so the text never runs ahead of what is on screen
        function computePhase() {
            if (entrenchedCount > 0) {
                const grammarSeen = nodes.some(n => n.word.startsWith('〜') && n.types.size >= SCHEMA_TYPES);
                return grammarSeen ? 3 : 2;
            }
            return utterCount >= 6 ? 1 : 0;
        }

        function updatePhase() {
            const p = computePhase();
            if (p === phase) return;
            phase = p;
            $('phaseTitle').textContent = PHASES[p].title;
            $('phaseDesc').textContent = PHASES[p].desc();
        }

        // --- Physics: spacing adapts to the stage area ---
        function labelBox(n) {
            return {
                w: Math.max(n.r * 2, n.labelW) + 14,
                h: n.r * 2 + n.fontSize + 9,
                cy: n.y - (n.fontSize + 5) / 2,
            };
        }

        function clampToStage(n) {
            const halfW = Math.max(n.r, n.labelW / 2) + 4;
            n.x = Math.max(halfW, Math.min(W - halfW, n.x));
            n.y = Math.max(n.r + n.fontSize + 8, Math.min(H - n.r - 4, n.y));
        }

        function simulate() {
            const n = nodes.length;
            if (!n) return;
            const spacing = Math.max(34, Math.min(90, Math.sqrt(W * H / Math.max(n, 12)) * 0.75));
            const range = spacing * 1.8;
            const gx = 0.0006, gy = 0.0006 * Math.max(1, W / H);
            const boxes = nodes.map(labelBox);

            for (const a of nodes) {
                a.vx += (W / 2 - a.x) * gx;
                a.vy += (H / 2 - a.y) * gy;
            }
            for (let i = 0; i < n; i++) {
                const a = nodes[i], ba = boxes[i];
                for (let j = i + 1; j < n; j++) {
                    const b = nodes[j], bb = boxes[j];
                    let dx = b.x - a.x, dy = b.y - a.y;
                    let d = Math.hypot(dx, dy);
                    if (d < 0.01) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d = Math.hypot(dx, dy); }
                    if (d < range) {
                        const f = (range - d) / range * 0.8;
                        const fx = dx / d * f, fy = dy / d * f;
                        a.vx -= fx; a.vy -= fy;
                        b.vx += fx; b.vy += fy;
                    }
                    // Labels must not overlap: separate the boxes along the axis of least overlap
                    const dcy = bb.cy - ba.cy;
                    const ox = (ba.w + bb.w) / 2 - Math.abs(dx);
                    const oy = (ba.h + bb.h) / 2 - Math.abs(dcy);
                    if (ox > 0 && oy > 0) {
                        if (ox < oy) {
                            const s = (dx >= 0 ? 1 : -1) * ox * 0.12;
                            a.vx -= s; b.vx += s;
                        } else {
                            const s = (dcy >= 0 ? 1 : -1) * oy * 0.12;
                            a.vy -= s; b.vy += s;
                        }
                    }
                }
            }
            for (const l of links) {
                const { a, b } = l;
                const dx = b.x - a.x, dy = b.y - a.y;
                const d = Math.max(Math.hypot(dx, dy), 0.01);
                const t = countScale(l.count);
                const f = (d - spacing * (1 - 0.35 * t) - (a.r + b.r) * 0.5) * (0.012 + 0.03 * t);
                const fx = dx / d * f, fy = dy / d * f;
                a.vx += fx; a.vy += fy;
                b.vx -= fx; b.vy -= fy;
            }
            for (const a of nodes) {
                if (a === dragNode) { a.vx = a.vy = 0; continue; }
                a.vx *= 0.8;
                a.vy *= 0.8;
                const v = Math.hypot(a.vx, a.vy);
                if (v > 10) { a.vx *= 10 / v; a.vy *= 10 / v; }
                a.x += a.vx;
                a.y += a.vy;
                clampToStage(a);
            }
        }

        // Sizes ease toward their targets; input pulses and link flashes fade out
        function easeVisuals(dt) {
            let busy = false;
            const ease = 1 - Math.pow(0.85, dt / STEP_MS);
            const base = W < 480 ? 11 : 13;
            for (const n of nodes) {
                const t = freqScale(n.freq);
                const target = (5 + 15 * t) * sizeScale;
                n.r += (target - n.r) * ease;
                n.fontSize = Math.round(base + 5 * t * sizeScale);
                n.appear = Math.min(1, n.appear + dt / 400);
                n.pulse = Math.max(0, n.pulse - dt / 900);
                if (Math.abs(target - n.r) > 0.1 || n.appear < 1 || n.pulse > 0) busy = true;
            }
            for (const l of links) {
                l.flash = Math.max(0, l.flash - dt / 1200);
                if (l.flash > 0) busy = true;
            }
            return busy;
        }

        // --- Render ---
        function disc(x, y, r, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
        }

        function ring(x, y, r, color, width) {
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.stroke();
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            const focus = hoverNode;
            const near = new Set();
            if (focus) links.forEach(l => {
                if (l.a === focus) near.add(l.b);
                else if (l.b === focus) near.add(l.a);
            });
            const faded = n => focus && n !== focus && !near.has(n);

            ctx.lineCap = 'round';
            for (const l of links) {
                const t = countScale(l.count);
                let alpha = 0.15 + 0.45 * t;
                if (focus) alpha = (l.a === focus || l.b === focus) ? Math.max(alpha, 0.85) : alpha * 0.2;
                ctx.strokeStyle = `rgba(200, 205, 255, ${Math.min(1, alpha + l.flash * 0.6)})`;
                ctx.lineWidth = 0.75 + 4.25 * t;
                ctx.beginPath();
                ctx.moveTo(l.a.x, l.a.y);
                ctx.lineTo(l.b.x, l.b.y);
                ctx.stroke();
            }

            for (const n of nodes) {
                const alpha = n.appear * (faded(n) ? 0.25 : 1);
                if (n.pulse > 0) {
                    ctx.globalAlpha = alpha * n.pulse;
                    ring(n.x, n.y, n.r + 3 + (1 - n.pulse) * 12, n.cat.color, 2);
                }
                ctx.globalAlpha = alpha;
                disc(n.x, n.y, n.r + 2, BG);   // 2px surface gap separates touching marks
                disc(n.x, n.y, n.r, n.cat.color);
                if (n === focus) ring(n.x, n.y, n.r + 3, '#ffffff', 2);
                else if (currentNodes.has(n)) ring(n.x, n.y, n.r + 3, 'rgba(255,255,255,0.75)', 1.5);
            }

            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.lineJoin = 'round';
            for (const n of nodes) {
                ctx.font = `600 ${n.fontSize}px ${FONT}`;
                if (n.measuredSize !== n.fontSize) {
                    n.labelW = ctx.measureText(n.word).width;
                    n.measuredSize = n.fontSize;
                }
                ctx.globalAlpha = n.appear * (faded(n) ? 0.3 : 1);
                const y = n.y - n.r - 3;
                ctx.lineWidth = 3;
                ctx.strokeStyle = 'rgba(10,10,26,0.85)';
                ctx.strokeText(n.word, n.x, y);
                ctx.fillStyle = '#f0f0f5';
                ctx.fillText(n.word, n.x, y);
            }
            ctx.globalAlpha = 1;
            updateTooltip(near);
        }

        function updateTooltip(near) {
            const n = hoverNode;
            if (!n) { tooltip.hidden = true; tooltipKey = ''; return; }
            const key = `${n.word}|${n.freq}|${n.degree}`;
            if (key !== tooltipKey) {
                tooltipKey = key;
                $('tooltipWord').replaceChildren(dotEl(n.cat.color), n.word);
                $('tooltipInfo').replaceChildren(...[
                    ['出現回数', `${n.freq}回`],
                    ['共起する語', `${n.degree}語`],
                    ['カテゴリー', n.cat.name],
                ].flatMap(([k, v]) => [el('dt', k), el('dd', v)]));
            }
            tooltip.hidden = false;
            const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
            // Right, left, above or below: take the spot that covers the fewest highlighted words
            const spots = [
                [n.x + n.r + 14, n.y - th / 2],
                [n.x - n.r - 14 - tw, n.y - th / 2],
                [n.x - tw / 2, n.y - n.r - n.fontSize - 12 - th],
                [n.x - tw / 2, n.y + n.r + 12],
            ].map(([x, y]) => [Math.max(4, Math.min(W - tw - 4, x)), Math.max(4, Math.min(H - th - 4, y))]);
            const covered = ([x, y]) => [n, ...near].filter(m =>
                m.x + m.r > x && m.x - m.r < x + tw && m.y + m.r > y && m.y - m.r - m.fontSize < y + th).length;
            let best = spots[0];
            for (const s of spots) if (covered(s) < covered(best)) best = s;
            tooltip.style.transform = `translate(${best[0]}px, ${best[1]}px)`;
        }

        // --- Animation loop: runs only while visible; idles when paused and settled ---
        function wake() {
            if (rafId || !inView) return;
            lastTime = performance.now();
            rafId = requestAnimationFrame(frame);
        }

        function frame(time) {
            rafId = 0;
            if (!inView) return;
            const dt = Math.max(0, Math.min(time - lastTime, 100));
            lastTime = time;
            if (!paused) {
                tickAcc += dt * speed;
                while (tickAcc >= TICK_MS) { tickAcc -= TICK_MS; step(); }
                physAcc += dt;
                while (physAcc >= STEP_MS) { physAcc -= STEP_MS; simulate(); }
            }
            const busy = easeVisuals(dt);
            draw();
            if (!paused || busy) rafId = requestAnimationFrame(frame);
        }

        function resize() {
            const rect = stage.getBoundingClientRect();
            W = rect.width;
            H = rect.height;
            sizeScale = Math.max(0.55, Math.min(1, Math.sqrt(W * H / 320000)));   // smaller stages get smaller circles
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            nodes.forEach(clampToStage);
            wake();
        }

        // --- Interaction ---
        function nodeAt(x, y) {
            for (let i = nodes.length - 1; i >= 0; i--) {
                const n = nodes[i];
                const dx = x - n.x, dy = y - n.y;
                const hitR = Math.max(n.r + 6, 12);
                if (dx * dx + dy * dy <= hitR * hitR) return n;
                const labelBottom = n.y - n.r - 3;
                if (Math.abs(dx) <= n.labelW / 2 + 2 && y <= labelBottom && y >= labelBottom - n.fontSize - 2) return n;
            }
            return null;
        }

        function localPos(e) {
            const rect = canvas.getBoundingClientRect();
            return [e.clientX - rect.left, e.clientY - rect.top];
        }

        function setHover(n) {
            if (n === hoverNode) return;
            hoverNode = n;
            if (!dragNode) canvas.style.cursor = n ? 'grab' : 'default';
            wake();
        }

        function moveDrag(e) {
            [dragNode.x, dragNode.y] = localPos(e);
            clampToStage(dragNode);
            wake();
        }

        function endDrag(e) {
            dragNode = null;
            setHover(e.target === canvas ? nodeAt(...localPos(e)) : null);
            canvas.style.cursor = hoverNode ? 'grab' : 'default';
        }

        canvas.addEventListener('mousedown', e => {
            const n = nodeAt(...localPos(e));
            if (!n) return;
            dragNode = n;
            setHover(n);
            canvas.style.cursor = 'grabbing';
            e.preventDefault();
        });
        window.addEventListener('mousemove', e => {
            if (dragNode && !(e.buttons & 1)) endDrag(e);   // button was released outside the iframe
            if (dragNode) moveDrag(e);
            else if (e.target === canvas) setHover(nodeAt(...localPos(e)));
        });
        window.addEventListener('mouseup', e => { if (dragNode) endDrag(e); });
        canvas.addEventListener('mouseleave', () => { if (!dragNode) setHover(null); });

        // Touch: tapping a word pins its tooltip; tapping empty space clears it and lets the page scroll
        canvas.addEventListener('touchstart', e => {
            const n = nodeAt(...localPos(e.touches[0]));
            setHover(n);
            if (n) { dragNode = n; e.preventDefault(); }
        }, { passive: false });
        canvas.addEventListener('touchmove', e => {
            if (!dragNode) return;
            moveDrag(e.touches[0]);
            e.preventDefault();
        }, { passive: false });
        ['touchend', 'touchcancel'].forEach(type => canvas.addEventListener(type, () => { dragNode = null; }));

        // --- Controls ---
        function setPaused(p) {
            paused = p;
            pauseBtn.textContent = p ? '▶ 再生' : '⏸ 一時停止';
            wake();
        }

        function reset() {
            nodes.length = 0;
            links.length = 0;
            nodeByWord.clear();
            linkByKey.clear();
            currentNodes.clear();
            corpus.forEach(u => { u.seen = 0; });
            random = mulberry32(SEED);
            current = null;
            phase = -1;
            utterCount = entrenchedCount = maxFreq = maxCount = 0;
            hoverNode = dragNode = null;
            tickAcc = TICK_MS;   // first word right away
            $('tickerNo').textContent = '入力';
            $('tickerText').textContent = '…';
            $('tickerCount').textContent = '';
            updateStats();
            updatePhase();
            setPaused(false);
        }

        pauseBtn.addEventListener('click', () => setPaused(!paused));
        $('resetBtn').addEventListener('click', reset);
        $('speedGroup').addEventListener('click', e => {
            const btn = e.target.closest('button[data-speed]');
            if (!btn) return;
            speed = Number(btn.dataset.speed);
            $('speedGroup').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === btn));
        });

        $('legend').prepend(...CATEGORIES.map(c => {
            const item = el('span', '');
            item.className = 'item';
            item.append(dotEl(c.color), c.name);
            return item;
        }));

        // --- Init: start only once the stage scrolls into view (the iframe sits deep in the lecture page) ---
        resize();
        reset();
        new ResizeObserver(resize).observe(stage);
        new IntersectionObserver(([entry]) => {
            if (entry.intersectionRatio >= 0.25) { inView = true; wake(); }
            else if (!entry.isIntersecting) inView = false;
        }, { threshold: [0, 0.3] }).observe(stage);
    })();
    </script>
</body>
</html>
