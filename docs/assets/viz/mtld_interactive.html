<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTLD計算の可視化</title>
<style>
  :root {
    --bg: #ffffff;
    --bg2: #f5f5f5;
    --bg3: #e3e3e3;
    --text: #1a1a1a;
    --text2: #555;
    --text3: #6b6b6b;
    --accent: #534AB7;
    --accent-light: #EEEDFE;
    --accent-text: #3C3489;
    --info-bg: #E6F1FB;
    --info-text: #185FA5;
    --warn: #BA7517;
    --warn-light: #FBF0DE;
    --warn-border: #E9C48A;
    --warn-text: #7A4D0B;
    --border: rgba(0,0,0,.12);
    --font: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    --mono: "SF Mono", "Cascadia Code", "Source Han Code JP", Menlo, Consolas, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    padding: 14px 18px;
    line-height: 1.6;
    font-size: 14px;
  }

  /* --- Controls on top and the status on its own line, so nothing moves under the cursor --- */
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
  .status { font-size: 13px; font-weight: 600; color: var(--accent-text); margin-bottom: 4px; }
  .btn {
    padding: 6px 14px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg2);
    color: var(--text); font-size: 13px; cursor: pointer;
    font-family: var(--font); transition: all .15s;
  }
  .btn:hover { border-color: var(--accent); background: var(--accent-light); }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn:disabled:hover { border-color: var(--border); background: var(--bg2); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { opacity: .9; }
  .btn.primary:disabled:hover { background: var(--accent); border-color: var(--accent); }
  .speed { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .speed button {
    padding: 6px 10px; border: none; background: var(--bg);
    font-size: 12px; color: var(--text2); cursor: pointer; font-family: var(--font);
  }
  .speed button + button { border-left: 1px solid var(--border); }
  .speed button[aria-pressed="true"] { background: var(--accent-light); color: var(--accent-text); }

  /* --- Legend --- */
  .legend {
    display: flex; gap: 4px 12px; flex-wrap: wrap;
    font-size: 12px; color: var(--text2); margin-bottom: 4px;
  }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .sw { width: 14px; height: 12px; border-radius: 3px; border: 1px solid transparent; flex-shrink: 0; }

  /* --- Tokens: states change colors only, never sizes, so the text does not reflow --- */
  #tokens { line-height: 2.1; margin-bottom: 8px; }
  .tok {
    position: relative; display: inline-block; padding: 1px 7px; margin: 2px;
    border-radius: 4px; font-size: 13px; font-family: var(--mono);
    border: 1px solid var(--bg3); background: var(--bg); color: var(--text3);
    transition: background .2s, color .2s, border-color .2s;
  }
  .tok.open { background: var(--accent-light); border-color: var(--accent-light); color: var(--accent-text); }
  .tok.closed { background: var(--info-bg); border-color: var(--info-bg); color: var(--info-text); }
  .tok.residual { background: var(--warn-light); border-color: var(--warn-border); color: var(--warn-text); }
  .tok.cur-new { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tok.cur-rep { background: var(--warn); border-color: var(--warn); color: #fff; }
  .tok.same { box-shadow: 0 0 0 2px var(--warn); }
  /* Boundary after a completed segment (on the left side in the reverse scan) */
  .tok.end-r::after, .tok.end-l::before {
    content: ""; position: absolute; top: 3px; bottom: 3px; width: 2px;
    border-radius: 1px; background: var(--info-text);
  }
  .tok.end-r::after { right: -4px; }
  .tok.end-l::before { left: -4px; }

  /* --- TTR chart --- */
  #chart { display: block; width: 100%; height: 130px; }
  #chart .grid { stroke: var(--bg3); stroke-width: 1; }
  #chart .thresh { stroke: var(--warn); stroke-width: 1.5; }
  #chart .lbl { font-size: 11px; fill: var(--text3); font-family: var(--font); }
  #chart .ttr { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }

  .explain { font-size: 13px; color: var(--text2); min-height: 3.2em; margin: 6px 0 8px; }
  .explain b { color: var(--text); font-weight: 600; }

  /* --- Results: fixed rows that fill in place --- */
  .results { width: 100%; border-collapse: collapse; font-size: 13px; }
  .results th, .results td {
    padding: 5px 10px; text-align: left; vertical-align: top;
    border-top: 1px solid var(--border);
  }
  .results thead th { border-top: none; font-size: 12px; font-weight: normal; color: var(--text3); }
  .results tbody th { width: 4.5em; font-weight: 600; white-space: nowrap; }
  .results td { font-family: var(--mono); }
  .results td b { font-weight: 700; }
  .results small { display: block; font-size: 11px; color: var(--text3); font-family: var(--font); }
  .results .total th, .results .total td { background: var(--info-bg); color: var(--info-text); }

  @media (max-width: 480px) {
    body { padding: 12px; }
    .explain { min-height: 4.8em; }
    .results th, .results td { padding: 5px 6px; }
    .results td { font-size: 12px; }
  }
</style>
</head>
<body>

<div class="controls">
  <button class="btn primary" id="btn-step">次の語 →</button>
  <button class="btn" id="btn-auto">▶ 自動再生</button>
  <button class="btn" id="btn-reset">リセット</button>
  <div class="speed" id="speed" role="group" aria-label="再生速度">
    <button data-ms="700" aria-pressed="false">ゆっくり</button>
    <button data-ms="350" aria-pressed="true">ふつう</button>
    <button data-ms="120" aria-pressed="false">はやい</button>
  </div>
</div>
<div class="status" id="status"></div>

<div class="legend">
  <span><span class="sw" style="border-color:var(--bg3)"></span>未読</span>
  <span><span class="sw" style="background:var(--accent-light)"></span>現在のセグメント</span>
  <span><span class="sw" style="background:var(--info-bg)"></span>セグメント完了</span>
  <span><span class="sw" style="background:var(--warn-light);border-color:var(--warn-border)"></span>残余</span>
  <span><span class="sw" style="background:var(--accent)"></span>新しい語</span>
  <span><span class="sw" style="background:var(--warn)"></span>くり返しの語</span>
</div>

<div id="tokens"></div>
<svg id="chart" role="img" aria-label="TTRの推移と閾値0.720"></svg>
<p class="explain" id="explain"></p>

<table class="results">
  <thead><tr><th></th><th>完了セグメント ＋ 残余</th><th>MTLD</th></tr></thead>
  <tbody>
    <tr><th>順方向</th><td id="f0"></td><td id="m0"></td></tr>
    <tr><th>逆方向</th><td id="f1"></td><td id="m1"></td></tr>
    <tr class="total"><th>MTLD</th><td colspan="2" id="mtld"></td></tr>
  </tbody>
</table>

<script>
// Tokens separated by spaces (surface forms, split the way a morphological analyzer would)
const TEXT = "私 は 大学 で 言語学 を 勉強 し て いる 言語学 の 授業 は 毎日 ある 私 の 専門 は コーパス 言語学 で " +
  "コーパス を 使っ て 言葉 の 特徴 を 調べ て いる コーパス に は 新聞 や 小説 など の 文章 が 入っ て いる " +
  "たくさん の 文章 を 調べる と 言葉 の 使い方 が 見え て くる 使い方 の 傾向 が わかる と 面白い";
const THRESHOLD = 0.72;

const words = TEXT.split(" ");
const N = words.length;
const $ = id => document.getElementById(id);

// One scan in the given order, as in lexicalrichness: a segment closes when TTR <= threshold,
// and a segment closing on the very last word leaves no partial factor.
function scan(order) {
  const steps = [], segments = [];
  let seen = new Map(), start = 0;
  order.forEach((idx, k) => {
    const w = words[idx];
    const prev = seen.get(w) || [];
    seen.set(w, [...prev, idx]);
    const tokens = k - start + 1;
    const ttr = seen.size / tokens;
    const step = { idx, w, prev, types: seen.size, tokens, ttr, seg: segments.length, closes: ttr <= THRESHOLD };
    if (step.closes) {
      segments.push({ from: start, to: k });
      seen = new Map();
      start = k + 1;
    }
    steps.push(step);
  });
  const residual = N - start;
  const resTTR = residual ? steps[N - 1].ttr : 1;
  const partial = residual ? (1 - resTTR) / (1 - THRESHOLD) : 0;
  const factors = segments.length + partial || 1;   // an all-unique text counts as one factor
  const pos = [];
  order.forEach((idx, k) => { pos[idx] = k; });
  return { steps, segments, residual, resTTR, partial, factors, mtld: N / factors, pos };
}

const indices = words.map((_, i) => i);
const passes = [scan(indices), scan([...indices].reverse())];
const mean = (passes[0].mtld + passes[1].mtld) / 2;

let pass = 0, k = 0;   // k = words read in the current pass
let timer = null, hold = 0, interval = 350;

const isDone = () => pass === 1 && k === N;
const closedCount = () => k ? passes[pass].steps[k - 1].seg + (passes[pass].steps[k - 1].closes ? 1 : 0) : 0;

$("tokens").innerHTML = words.map(w => `<span class="tok">${w}</span>`).join("");
const tokenEls = [...$("tokens").children];

function render() {
  const P = passes[pass];
  const cur = k ? P.steps[k - 1] : null;
  const closed = closedCount();

  tokenEls.forEach((el, i) => {
    const p = P.pos[i];
    let cls = "tok";
    if (p < k) {
      const s = P.steps[p].seg;
      cls += s < closed ? " closed" : k === N ? " residual" : " open";
      if (s < closed && p === P.segments[s].to) cls += pass === 0 ? " end-r" : " end-l";
    }
    if (cur && i === cur.idx) cls += cur.prev.length ? " cur-rep" : " cur-new";
    if (cur && cur.prev.includes(i)) cls += " same";
    el.className = cls;
  });

  $("status").textContent = pass === 0
    ? (k < N ? "① 順方向：先頭から1語ずつ読む" : "① 順方向：完了 → 次は逆方向")
    : (k < N ? "② 逆方向：末尾から1語ずつ読む" : "✓ 計算完了");
  $("explain").innerHTML = explain(P, cur);
  drawChart(P, closed);
  drawResults(closed);

  $("btn-step").disabled = isDone();
  $("btn-auto").textContent = timer ? "⏸ 一時停止" : "▶ 自動再生";
}

function explain(P, cur) {
  const th = THRESHOLD.toFixed(3);
  if (!cur) {
    return pass === 0
      ? `「次の語 →」で1語ずつ読み進めます。TTR（異なり語数 ÷ 延べ語数）が<b>${th}以下</b>になるとセグメントが1つ完了し、次の語から数え直します。`
      : "逆方向：今度は末尾の語から先頭に向かって、同じ手順をくり返します。";
  }
  if (k === N && P.residual) {
    return `最後の${P.residual}語はセグメントの途中で終わりました（TTR ${P.resTTR.toFixed(3)}）→ ` +
      `残余の割合 = (1 − ${P.resTTR.toFixed(3)}) ÷ (1 − ${th}) = <b>${P.partial.toFixed(3)}</b>`;
  }
  let t = `「${cur.w}」は${cur.prev.length ? `セグメント内で${cur.prev.length + 1}回目` : "セグメント内で初めての語"} → ` +
    `異なり語数 ${cur.types} ÷ 延べ語数 ${cur.tokens} = <b>TTR ${cur.ttr.toFixed(3)}</b>`;
  if (cur.closes) t += ` ≤ ${th} → <b>セグメント${cur.seg + 1}が完了</b>（${cur.tokens}語）`;
  if (k === N) t += "。残余はありません";
  return t;
}

function drawChart(P, closed) {
  const w = $("chart").getBoundingClientRect().width, h = 130;
  const m = { l: 34, r: 8, t: 14, b: 18 };
  const step = (w - m.l - m.r) / N;
  const x = i => m.l + (i + 0.5) * step;
  const y = v => m.t + (1 - v) / 0.5 * (h - m.t - m.b);   // TTR 1.0 at the top, 0.5 at the bottom
  const band = (from, to, color, label) => {
    const x0 = x(from) - step / 2, x1 = x(to) + step / 2;
    return `<rect x="${x0}" y="${m.t}" width="${x1 - x0}" height="${h - m.t - m.b}" style="fill:${color}"/>` +
      (x1 - x0 > label.length * 11 + 8 ? `<text x="${(x0 + x1) / 2}" y="${m.t - 3}" text-anchor="middle" class="lbl">${label}</text>` : "");
  };

  let s = "";
  P.segments.slice(0, closed).forEach((seg, j) => { s += band(seg.from, seg.to, "var(--info-bg)", `セグメント${j + 1}`); });
  if (k === N && P.residual) s += band(N - P.residual, N - 1, "var(--warn-light)", "残余");
  [1, 0.5].forEach(v => {
    s += `<line x1="${m.l}" x2="${w - m.r}" y1="${y(v)}" y2="${y(v)}" class="grid"/>` +
      `<text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end" class="lbl">${v.toFixed(1)}</text>`;
  });
  s += `<line x1="${m.l}" x2="${w - m.r}" y1="${y(THRESHOLD)}" y2="${y(THRESHOLD)}" class="thresh"/>` +
    `<text x="${m.l - 6}" y="${y(THRESHOLD) + 4}" text-anchor="end" class="lbl">${THRESHOLD}</text>` +
    `<text x="${m.l}" y="${h - 3}" class="lbl">1</text>` +
    `<text x="${(m.l + w - m.r) / 2}" y="${h - 3}" text-anchor="middle" class="lbl">読んだ語の数 →</text>` +
    `<text x="${w - m.r}" y="${h - 3}" text-anchor="end" class="lbl">${N}</text>`;

  // One line per segment: TTR restarts at 1.0 after each boundary
  let pts = [], seg = -1;
  const flush = () => { if (pts.length > 1) s += `<polyline points="${pts.join(" ")}" class="ttr"/>`; pts = []; };
  P.steps.slice(0, k).forEach((st, i) => {
    if (st.seg !== seg) { flush(); seg = st.seg; }
    pts.push(`${x(i)},${y(st.ttr)}`);
  });
  flush();
  P.steps.slice(0, k).forEach((st, i) => {
    const current = i === k - 1;
    if (!st.closes && !current) return;
    const color = st.prev.length ? "var(--warn)" : "var(--accent)";
    s += `<circle cx="${x(i)}" cy="${y(st.ttr)}" r="${current ? 4.5 : 4}" style="fill:${color};stroke:#fff;stroke-width:1.5"/>`;
  });
  $("chart").innerHTML = s;
}

// Every cell is a value plus a small second line, so rows keep their height in every state
function drawResults(closed) {
  [0, 1].forEach(p => {
    const P = passes[p];
    let f = "—<small>&nbsp;</small>", mtld = "—<small>&nbsp;</small>";
    if (pass > p || (pass === p && k === N)) {
      f = `${P.segments.length} ＋ ${P.partial.toFixed(3)}` +
        `<small>${P.residual ? `残余 ${P.residual}語・TTR ${P.resTTR.toFixed(3)}` : "残余なし"}</small>`;
      mtld = `<b>${P.mtld.toFixed(1)}</b><small>${N} ÷ ${P.factors.toFixed(3)}</small>`;
    } else if (pass === p && k) {
      f = `${closed} ＋ …<small>読み取り中</small>`;
    }
    $("f" + p).innerHTML = f;
    $("m" + p).innerHTML = mtld;
  });
  $("mtld").innerHTML = isDone()
    ? `(${passes[0].mtld.toFixed(1)} ＋ ${passes[1].mtld.toFixed(1)}) ÷ 2 = <b>${mean.toFixed(1)}</b>`
    : "順方向と逆方向の平均";
}

function step() {
  if (isDone()) return;
  if (k === N) { pass = 1; k = 0; }
  else k++;
  render();
}

function stop() {
  clearInterval(timer);
  timer = null;
  render();
}

function play() {
  if (isDone()) reset();
  timer = setInterval(() => {
    if (hold) { hold--; return; }
    step();
    if (pass === 0 && k === N) hold = 3;   // pause on the forward result before the reverse scan
    if (isDone()) stop();
  }, interval);
  render();
}

function reset() {
  clearInterval(timer);
  timer = null;
  pass = 0; k = 0; hold = 0;
  render();
}

$("btn-step").addEventListener("click", step);
$("btn-auto").addEventListener("click", () => (timer ? stop() : play()));
$("btn-reset").addEventListener("click", reset);
$("speed").addEventListener("click", e => {
  const btn = e.target.closest("button[data-ms]");
  if (!btn) return;
  interval = Number(btn.dataset.ms);
  $("speed").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === btn));
  if (timer) { clearInterval(timer); timer = null; play(); }
});

// Same-origin embed: let the iframe take the height of the content (no inner scrollbar on phones)
function fitFrame() {
  if (window.frameElement) window.frameElement.style.height = Math.ceil(document.body.getBoundingClientRect().height) + "px";
}
new ResizeObserver(() => { render(); fitFrame(); }).observe(document.body);
render();
</script>
</body>
</html>
